# herdr-navigator — prefix t. Every option with docs:
# https://github.com/thanhdat77/herdr-navigator/blob/main/examples/default-config.toml
# Defaults are kept (nucleo engine, zoxide + open workspaces + agents) except
# the labels, vim_mode and the project roots (same list as tmux-sessionizer).

[picker]
# Plain workspace labels instead of "project:"/"dir:" prefixes, like tmux sessions.
prefix_workspace_labels = false
# Normal-mode j/k, source keys, and / to search; i or / enters typing.
vim_mode = true

[notifications]
audio = false

[[roots]]
path = "~/.tmux-sessions"
max_depth = 1
