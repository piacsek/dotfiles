# herdr-navigator — prefix t. Every option with docs:
# https://github.com/thanhdat77/herdr-navigator/blob/main/examples/default-config.toml
# Defaults are kept (type-to-search, nucleo engine, zoxide + open workspaces +
# agents). Only the project roots are set, matching tmux-sessionizer's list.

[picker]
# Plain workspace labels instead of "project:"/"dir:" prefixes, like tmux sessions.
prefix_workspace_labels = false

[notifications]
audio = false

[[roots]]
path = "~/.tmux-sessions"
max_depth = 1
