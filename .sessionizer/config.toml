# herdr-sessionizer layout for the dotfiles workspace — mirrors .tmux-sessionizer
# (one tab per nvim project, nvim | claude in each). Panes have no cwd field,
# so each command cds first.
[layout]
focus = "dotfiles-editor"

[tabs.dotfiles]
label = "dotfiles"
[[tabs.dotfiles.panes]]
id = "dotfiles-editor"
title = "nvim"
command = "nvim"
[[tabs.dotfiles.panes]]
id = "dotfiles-agent"
from = "dotfiles-editor"
title = "claude"
split = "right"
ratio = 0.5
command = "claude"

[tabs.ghostty-mirror]
label = "ghostty-mirror"
[[tabs.ghostty-mirror.panes]]
id = "gm-editor"
title = "nvim"
command = "cd ~/projects/ghostty-mirror.nvim && nvim"
[[tabs.ghostty-mirror.panes]]
id = "gm-agent"
from = "gm-editor"
title = "claude"
split = "right"
ratio = 0.5
command = "cd ~/projects/ghostty-mirror.nvim && claude"

[tabs.scintilla]
label = "scintilla"
[[tabs.scintilla.panes]]
id = "sc-editor"
title = "nvim"
command = "cd ~/projects/scintilla.nvim && nvim"
[[tabs.scintilla.panes]]
id = "sc-agent"
from = "sc-editor"
title = "claude"
split = "right"
ratio = 0.5
command = "cd ~/projects/scintilla.nvim && claude"

[tabs.stargum]
label = "stargum"
[[tabs.stargum.panes]]
id = "st-editor"
title = "nvim"
command = "cd ~/projects/stargum.nvim && nvim"
[[tabs.stargum.panes]]
id = "st-agent"
from = "st-editor"
title = "claude"
split = "right"
ratio = 0.5
command = "cd ~/projects/stargum.nvim && claude"
