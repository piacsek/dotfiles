# Hand-made (not auto-generated) — pins sapphire to a cyan accent (purple clashed
# with the blue theme). bar = bg #04081a blended toward the cyan #6fd0d0.
set -g status-style "bg=#1c3442,fg=#d6e0f5"
set -g status-left-style "bg=#1c3442,fg=#d6e0f5"
set -g status-right-style "bg=#6fd0d0,fg=#04081a"
set -g window-status-style "bg=#1c3442,fg=#d6e0f5"
set -g window-status-current-style "bg=#6fd0d0,fg=#04081a"
set -g pane-active-border-style "fg=#6fd0d0"
set -g pane-border-style "fg=#5f6f90"
set -g message-style "bg=#1c3442,fg=#d6e0f5"
set -g message-command-style "bg=#1c3442,fg=#d6e0f5"
set -g mode-style "bg=#6fd0d0,fg=#04081a"
set -g clock-mode-colour "#6fd0d0"
