# Hand-made (not auto-generated) — pins amethyst to its rich magenta accent.
# bar = bg #0e0024 blended toward the accent #d700ff; accent = ANSI magenta.
set -g status-style "bg=#3a0054,fg=#ffffff"
set -g status-right-style "bg=#d700ff,fg=#ffffff"
set -g window-status-style "bg=#3a0054,fg=#ffffff"
set -g window-status-current-style "bg=#d700ff,fg=#ffffff"
set -g pane-active-border-style "fg=#d700ff"
set -g pane-border-style "fg=#afafff"
set -g message-style "bg=#3a0054,fg=#ffffff"
set -g message-command-style "bg=#3a0054,fg=#ffffff"
set -g mode-style "bg=#d700ff,fg=#ffffff"
set -g clock-mode-colour "#d700ff"
