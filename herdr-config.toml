# herdr — https://herdr.dev  (symlinked to ~/.config/herdr/config.toml)
#
# Mirrors the tmux workflow in .tmux.conf so both can be tested side by side.
# tmux is untouched: herdr only owns panes started from a `herdr` client.
# Run herdr in its own Ghostty tab, NOT inside a tmux pane (tmux would eat the
# ctrl+space prefix). Reload with `herdr server reload-config` (prefix ctrl+r).
#
# Parity map (tmux → herdr): session → workspace, window → tab, pane → pane.

onboarding = false

[theme]
# Follow the host terminal's ANSI palette, so ghostty-mirror.nvim's theme sync
# (nvim colorscheme → Ghostty) carries into herdr with no extra plumbing.
name = "terminal"

[terminal]
# Empty = $SHELL (zsh, login) so .zshrc aliases (claude --add-dir, lz, tx) work.
default_shell = ""
shell_mode = "auto"
new_cwd = "follow"

[keys]
# Same prefix as tmux. Ghostty has `keybind = ctrl+space=unbind` so it passes.
prefix = "ctrl+space"

# ---- session / server (tmux: d, C-r) ----
detach = ["prefix+q", "prefix+d"]
reload_config = ["prefix+shift+r", "prefix+ctrl+r"]

# ---- windows → tabs (tmux: c, &, ,, M-1..9) ----
new_tab = "prefix+c"
close_tab = ["prefix+shift+x", "prefix+ampersand"]
rename_tab = ["prefix+shift+t", "prefix+comma"]
switch_tab = "alt+1..9"
next_tab = "prefix+n"
previous_tab = "prefix+p"

# ---- panes (tmux: C-v side-by-side, C-s stacked, x, z, C-o copy mode) ----
split_vertical = ["prefix+v", "prefix+ctrl+v"]     # new pane to the right
split_horizontal = ["prefix+minus", "prefix+ctrl+s"] # new pane below
close_pane = "prefix+x"
zoom = "prefix+z"
copy_mode = ["prefix+[", "prefix+ctrl+o"]
last_pane = "prefix+semicolon"
# focus_pane_* stay on prefix+h/j/k/l; ctrl+h/j/k/l are wired to herdr-nvim-nav
# below (vim-tmux-navigator parity).

# ---- resize (tmux: C-. C-, C-' C-; repeatable) ----
resize_mode = "prefix+r"
resize_pane_right = "prefix+ctrl+period"
resize_pane_left = "prefix+ctrl+comma"
resize_pane_up = "prefix+ctrl+quote"
resize_pane_down = "prefix+ctrl+semicolon"

# ---- workspaces (tmux sessions) ----
workspace_picker = "prefix+w"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
switch_workspace = "alt+shift+1..9"

# ============================================================================
# Custom commands — the `bind -n M-*` popups and scripts from .tmux.conf
# ============================================================================

# M-e — tmux-sessionizer → herdr-sessionizer (fzf over ~/.tmux-sessions + open
# workspaces; new workspaces get the nvim|claude layout from
# ~/.config/herdr/plugins/config/sessionizer/config.toml or a repo-local
# .sessionizer/config.toml, the herdr counterpart of .tmux-sessionizer).
[[keys.command]]
key = "alt+e"
type = "plugin_action"
command = "sessionizer.open"
description = "sessionizer: open project workspace"

# M-g — tmux-git-flow: lazygit in a popup; if changes are staged on exit,
# auto-commit (Claude message via scripts/auto_commit) and push. Runs in the
# popup (foreground) instead of tmux's background run-shell + status widget.
[[keys.command]]
key = "alt+g"
type = "popup"
command = "cd \"$HERDR_ACTIVE_PANE_CWD\" && lazygit; git rev-parse --git-dir >/dev/null 2>&1 && ! git diff --cached --quiet && $HOME/dotfiles/scripts/auto_commit && git push -u origin HEAD"
description = "lazygit + auto commit/push"
width = "90%"
height = "90%"

# M-r — tmux-script-runner → herdr-plus quick actions. The "Scripts" action
# (plugins/config/cloudmanic.herdr-plus/quick-actions/available-scripts.toml)
# reads the nearest .available-scripts upward from the pane cwd.
[[keys.command]]
key = "alt+r"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "quick actions (.available-scripts runner)"

# M-t — scratch popup → herdr-floax: one persistent floating shell per
# workspace (dtach-backed, survives toggling).
[[keys.command]]
key = "alt+t"
type = "plugin_action"
command = "herdr-floax.toggle"
description = "toggle scratch shell"

# M-v — tailscale toggle (scripts/tmux-toggle-tailscale, minus tmux display-message)
[[keys.command]]
key = "alt+v"
type = "shell"
command = "if tailscale status --json 2>/dev/null | grep -q '\"BackendState\": \"Running\"'; then tailscale down && herdr notification show 'tailscale: down'; else tailscale up && herdr notification show 'tailscale: up'; fi"
description = "toggle tailscale"

# M-j / M-k / M-l / M-; — tmux-switch-slot 1..4 → focus the Nth workspace in
# sidebar order (workspace list order; slots shift when a workspace closes,
# same as tmux's creation-order slots).
[[keys.command]]
key = "alt+j"
type = "shell"
command = "herdr workspace focus \"$(herdr workspace list | jq -r '.result.workspaces[0].workspace_id')\""
description = "workspace slot 1"

[[keys.command]]
key = "alt+k"
type = "shell"
command = "herdr workspace focus \"$(herdr workspace list | jq -r '.result.workspaces[1].workspace_id')\""
description = "workspace slot 2"

[[keys.command]]
key = "alt+l"
type = "shell"
command = "herdr workspace focus \"$(herdr workspace list | jq -r '.result.workspaces[2].workspace_id')\""
description = "workspace slot 3"

[[keys.command]]
key = "alt+semicolon"
type = "shell"
command = "herdr workspace focus \"$(herdr workspace list | jq -r '.result.workspaces[3].workspace_id')\""
description = "workspace slot 4"

# prefix C-c — new window running claude → new tab in the pane's cwd running
# `claude` through the interactive zsh so the --add-dir alias expands.
[[keys.command]]
key = "prefix+ctrl+c"
type = "shell"
command = "id=$(herdr tab create --cwd \"$HERDR_ACTIVE_PANE_CWD\" --label claude --focus | jq -r .result.root_pane.pane_id) && herdr pane run \"$id\" claude"
description = "new claude tab"

# ---- vim-tmux-navigator → herdr-nvim-nav (C-h/j/k/l across nvim splits and panes) ----
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"
description = "navigate left (nvim-aware)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"
description = "navigate down (nvim-aware)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"
description = "navigate up (nvim-aware)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"
description = "navigate right (nvim-aware)"

# ============================================================================
[ui]
tab_bar_position = "top"
prompt_new_tab_name = false
# tmux parity: no mouse UI; the terminal handles clicks (Cmd-click URLs etc.).
# Pane apps that request mouse (lazygit, btop) still get it.
mouse_capture = false
# Status right ≈ tmux status-right (~/.tmux_work.conf): kube ctx | tailscale | clock.
# The git dirty marker is covered by the sidebar's branch + git_status rows.
tab_bar_right = [
  { type = "command", command = "$HOME/scripts/kube_status 2>/dev/null", interval_seconds = 5, timeout_seconds = 2 },
  { type = "command", command = "$HOME/scripts/tailscale_status 2>/dev/null", interval_seconds = 5, timeout_seconds = 2 },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " | "
window_title = "{workspace}"

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[experimental]
pane_history = false
