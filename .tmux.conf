set -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

setw -g mode-keys vi
bind -T copy-mode-vi i send-keys -X cancel
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-toggle

unbind r
bind C-r source-file $HOME/.tmux.conf

set -g base-index 1
set -g pane-base-index 1
bind-key & kill-window
bind-key x kill-pane
bind C-v split-window -h -c "#{pane_current_path}"
bind C-s split-window -v -c "#{pane_current_path}"
bind C-o copy-mode

# bind C-Space swap-pane -U \; select-pane -U \; if-shell "echo '#{pane_current_command}' | grep -vq vim" "copy-mode" "send-keys -X cancel"


bind C-Space swap-pane -U \; select-pane -U \; if-shell "echo '#{pane_current_command}' | grep -vq vim" "copy-mode" "send-keys -t :.! -X cancel"


bind C-Enter run-shell -b '\
  tmux copy-mode; \
  tmux send-keys -X select-line; \
  tmux send-keys -X copy-pipe-no-clear "grep -oE \"[^[:space:]]+\" | head -1 > /tmp/tmux-file-path"; \
  sleep 0.1; \
  file=$(cat /tmp/tmux-file-path 2>/dev/null | tr -d "\\n"); \
  tmux send-keys -X cancel; \
  if [ -n "$file" ] && [ -e "$file" ]; then \
    tmux select-window -t 1; \
    nvim_pane=$(tmux list-panes -t 1 -F "#{pane_index} #{pane_current_command}" | grep nvim | cut -d" " -f1 | head -1); \
    [ -n "$nvim_pane" ] && tmux select-pane -t "$nvim_pane"; \
    tmux send-keys Escape Escape ":e $file" Enter; \
  fi'

bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9


set-option -g renumber-windows on
set-option -g status-position top
set-window-option -g pane-base-index 1
set -s extended-keys on


set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'yassinebridi/tmux-purpura'

run '~/.tmux/plugins/tpm/tpm'

if-shell "test -f ~/.tmux_work.conf" "source ~/.tmux_work.conf"
