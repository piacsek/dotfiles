set -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

setw -g mode-keys vi
bind -T copy-mode-vi i send-keys -X cancel
bind -T copy-mode-vi g switch-client -T copy-mode-g
bind -T copy-mode-g g send-keys -X history-top
bind -T copy-mode-g f send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "~/dotfiles/scripts/tmux-gf"
# Capture the cursor column before select-line moves it, so tmux-gw can pick
# the URL under the cursor when a line has several.
bind -T copy-mode-g w set -wF @gw_x "#{copy_cursor_x}" \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "~/dotfiles/scripts/tmux-gw #{@gw_x}"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-toggle

unbind r
bind C-r source-file $HOME/.tmux.conf

set -g base-index 1
set -g pane-base-index 1
bind-key & kill-window
bind-key x kill-pane
bind-key = select-layout even-horizontal
bind-key | select-layout even-vertical
bind-key \\ select-layout main-vertical
set -g main-pane-width 50%
set -g main-pane-height 80%
set-hook -g after-new-window 'set -w @layout_toggle h'
set-hook -g after-split-window 'set -w @layout_toggle h'
bind M-t if-shell -F '#{==:#{@layout_toggle},h}' \
  'select-layout even-horizontal; set -w @layout_toggle v' \
  'select-layout main-horizontal; set -w @layout_toggle h'

bind C-v split-window -h -c "#{pane_current_path}"
bind C-s split-window -v -c "#{pane_current_path}"
bind C-o copy-mode
bind C-j command-prompt -I "1.1" -p "join pane to window:" "join-pane -t '%%'"
bind C-i command-prompt -p "insert window at index:","window name:" "run-shell 'tmux-insert-window %1 %2'"
bind C-Space run-shell "$HOME/dotfiles/scripts/tmux-focus-test"

bind -r C-. resize-pane -R 5
bind -r C-, resize-pane -L 5

bind -n M-e display-popup -E "tmux-sessionizer"
bind -n M-g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "$HOME/dotfiles/scripts/tmux-git-flow"
bind -n M-j run-shell "tmux-switch-slot 1"
bind -n M-k run-shell "tmux-switch-slot 2"
bind -n M-l run-shell "tmux-switch-slot 3"
bind -n M-\; run-shell "tmux-switch-slot 4"
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9


set-option -g renumber-windows on
set-option -g status-position top
set-window-option -g pane-base-index 1
set -s extended-keys on
# Forward terminal focus events to programs (nvim FocusGained/FocusLost), so
# ghostty-mirror's sync_on_focus fires when you switch between panes.
set-option -g focus-events on


set -g @yank_action 'copy-pipe-no-clear'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'

# Inlined from tmux-purpura (yassinebridi/tmux-purpura).
# Colors can be overridden by re-setting these options after this block
# (e.g. by ghostty-mirror.nvim's tmux integration).
set-option -g status-interval 5
set-option -g clock-mode-style 12
set-option -g status-left-length 100
set-option -g status-right-length 100

# Window labels: name only (no #I index, no #F flag), color-free so the styles
# set by ghostty-mirror's generated theme apply.
set-window-option -g window-status-format " #W "
set-window-option -g window-status-current-format " #W "

# Re-apply ghostty-mirror's last theme on server start (the plugin only
# sources it into a running server).
if-shell "test -f ~/.config/tmux/theme-current.conf" \
  "source-file ~/.config/tmux/theme-current.conf"

if-shell "test -f ~/.tmux_work.conf" "source ~/.tmux_work.conf"
