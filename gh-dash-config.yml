prSections:
    - title: My Pull Requests
      filters: is:open assignee:@me
    - title: Merged
      filters: org:wonderschool is:merged author:@me
      limit: 20
    - title: Needs My Review
      filters: is:open review-requested:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
issuesSections:
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
notificationsSections:
    - title: All
      filters: ""
    - title: Created
      filters: reason:author
    - title: Participating
      filters: reason:participating
    - title: Mentioned
      filters: reason:mention
    - title: Review Requested
      filters: reason:review-requested
    - title: Assigned
      filters: reason:assign
    - title: Subscribed
      filters: reason:subscribed
    - title: Team Mentioned
      filters: reason:team-mention
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        open: true
        width: 0.45
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 20
    notificationsLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: false
    refetchIntervalMinutes: 30
keybindings:
    prs:
        - key: ctrl+enter
          command: gh pr checkout {{.PrNumber}}
        - key: T
          command: >-
            tmux new-window -n gh-{{.PrNumber}}-ci '
              gh enhance -R {{.RepoName}} {{.PrNumber}}
            ' && sleep 0.5 && tmux send-keys -t '{right}' l z
        - key: R
          command: >-
            open "https://github.com/{{.RepoName}}/pull/{{.PrNumber}}" &&
            tmux new-window -n "pr-{{.PrNumber}}-review"
            "claude 'ultrathink review https://github.com/{{.RepoName}}/pull/{{.PrNumber}}'"
        - key: Q
          command: >-
            tmux display-popup -w 80% -h 60% -E
            "$HOME/dotfiles/scripts/gh-dash-merge-queue.sh {{.RepoName}} | less -R"
repoPaths: {}
theme:
    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: false
pager:
    diff: ""
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: false
includeReadNotifications: true
