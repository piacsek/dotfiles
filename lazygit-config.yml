git:
  autoFetch: true
  log:
    order: default
  pagers:
    - colorArg: always
      pager: delta --paging=never
customCommands:
  - key: "O"
    context: "files"
    description: "Open file in nvim on tmux window 1"
    command: "$HOME/dotfiles/scripts/lazygit-open-in-nvim.sh '{{.SelectedFile.Name}}'"
    output: none
  - key: "O"
    context: "commitFiles"
    description: "Open file in nvim on tmux window 1"
    command: "$HOME/dotfiles/scripts/lazygit-open-in-nvim.sh '{{.SelectedCommitFile.Name}}'"
    output: none
  - key: "<c-f>"
    context: "localBranches"
    description: "Fast-forward all branches with upstreams"
    command: "$HOME/dotfiles/scripts/lazygit-sync-branches.sh sync"
    output: log
    loadingText: "Syncing branches..."
  - key: "<c-x>"
    context: "localBranches"
    description: "Delete all branches merged into main"
    command: "$HOME/dotfiles/scripts/lazygit-sync-branches.sh delete"
    output: log
    loadingText: "Deleting merged branches..."
    prompts:
      - type: "confirm"
        title: "Delete merged branches"
        body: "Delete all local branches already merged into main (including squash-merges)? This force-deletes squash-merged branches."
